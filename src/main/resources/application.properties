# Application Configuration
spring.application.name=remote-it-support-server
server.port=8080
server.address=0.0.0.0

spring.config.import=optional:file:./.env[.properties],optional:file:/etc/secrets/.env[.properties]
# DATABASE CONFIGURATION
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT CONFIGURATION
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION}

# HEARTBEAT CONFIGURATION
agent.heartbeat.timeout=30
agent.scheduler.rate=10000

# GROQ API (Vision via Llama 4 Scout — OpenAI-compatible endpoint)
groq.api.key=${GROQ_API_KEY}
groq.model=meta-llama/llama-4-scout-17b-16e-instruct
